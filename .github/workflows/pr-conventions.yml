# Enforce the branching/merging conventions in CONTRIBUTING.md.
#
# PRs are squash-merged, so the PR title becomes the commit message on main, and
# release-please reads those messages to pick the next semantic version. The title must
# therefore follow Conventional Commits: <type>(<optional scope>)<optional !>: <summary>
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }} # via env: titles are untrusted input
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: [^ ].+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error title=PR title is not a Conventional Commit::Got \"$TITLE\". Use e.g. \"feat(web): add user search\", \"fix(api): reject expired tokens\" or \"feat!: drop v1 endpoints\". See CONTRIBUTING.md."
            exit 1
          fi

  branch:
    name: Branch name
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^((feat|fix|perf|refactor|docs|test|build|ci|chore|revert)/[a-z0-9._-]+|release-please--.+|dependabot/.+)$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "OK: $BRANCH"
          else
            # A warning, not a failure: the PR title is what matters for releases.
            echo "::warning title=Branch name::\"$BRANCH\" doesn't follow <type>/<short-description>, e.g. feat/user-search. See CONTRIBUTING.md."
          fi
