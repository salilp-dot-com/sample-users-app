# nginx site for the web app + API reverse proxy.
# install.sh copies this to /etc/nginx/sites-available/sample-users.
#
# Browser -> nginx :80 ──/──────> static files (/var/www/sample-users-web/current)
#                       └─/api/──> uvicorn 127.0.0.1:8000 (prefix stripped)
#
# Same origin for both, so no CORS is needed and auth cookies just work.
# For HTTPS, run `sudo certbot --nginx` (Let's Encrypt) after installing.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/sample-users-web/current;
    index index.html;

    # API: /api/users -> http://127.0.0.1:8000/users
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts content-hashed files in /assets/, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /users) all serve index.html; never cache it,
    # so a new release is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
