[project]
name = "sample-users-api"
version = "0.1.0"
description = "FastAPI users REST API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "moto>=5.2.6",
]
