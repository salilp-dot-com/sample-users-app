[project]
name = "sample-users-api"
version = "0.1.0"
description = "FastAPI users REST API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto>=5.2.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's `param = Depends(...)` defaults are idiomatic
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Migrations import app code after yoyo's own setup
"migrations/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette suggests httpx2 for TestClient; httpx still works fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
